<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Neuron Replay</title>
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <aside class="panel">
    <header>
      <p class="eyebrow">Neural network, slowed down</p>
      <h1>Watch it think</h1>
      <p class="meta">784 → 128 → 64 → 10 · trained locally in PyTorch · <span id="accuracy">–</span> test accuracy</p>
    </header>

    <div class="pad-wrap">
      <canvas id="pad" aria-label="Drawing pad"></canvas>
      <p class="pad-hint" id="pad-hint">Draw a digit 0–9</p>
    </div>

    <div class="controls">
      <button id="clear" title="Clear (C)">Clear <kbd>C</kbd></button>
      <button id="replay" title="Replay (Space)">Replay <kbd>␣</kbd></button>
      <button id="sample" title="Random test digit (R)">Random <kbd>R</kbd></button>
      <button id="loop" title="Loop random digits (L)" aria-pressed="false">Loop random <kbd>L</kbd></button>
    </div>

    <label class="speed">
      <span>Speed</span>
      <input id="speed" type="range" min="0" max="3" step="1" value="1">
      <output id="speed-label">0.5×</output>
    </label>

    <section class="result" id="result" aria-live="polite">
      <p class="result-label">Prediction</p>
      <div class="result-row">
        <span class="result-digit" id="result-digit">?</span>
        <div>
          <p class="result-conf" id="result-conf">waiting for a digit</p>
          <p class="result-note" id="result-note"></p>
        </div>
      </div>
    </section>
  </aside>

  <main class="stage">
    <canvas id="net" aria-label="Network visualization"></canvas>
    <div class="tooltip" id="tooltip" hidden>
      <p id="tooltip-title"></p>
      <canvas id="tooltip-canvas" width="28" height="28"></canvas>
      <p class="tooltip-legend"><span class="pos">■</span> wants ink · <span class="neg">■</span> wants empty</p>
    </div>
  </main>

  <script type="module" src="app.js"></script>
</body>
</html>
